<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <linearGradient id="bfWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bfWingShine" x1="10%" y1="10%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#67e8f9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Wings -->
  <g class="bf-wings-group">
    <!-- Left Forewing -->
    <path d="M 48 38 C 42 22 24 6 8 14 C -2 20 2 38 18 44 C 32 48 44 43 48 38 Z" fill="url(#bfWingGrad)" stroke="#0c4a6e" stroke-width="1.2" />
    <path d="M 46 37 C 40 25 26 13 14 18 C 6 22 10 34 22 39 C 32 43 42 40 46 37 Z" fill="url(#bfWingShine)" />
    <!-- Left Hindwing -->
    <path d="M 47 42 C 40 48 24 50 16 62 C 10 70 24 76 34 68 C 42 62 46 50 47 42 Z" fill="url(#bfWingGrad)" stroke="#0c4a6e" stroke-width="1.2" />
    <!-- Right Forewing -->
    <path d="M 52 38 C 58 22 76 6 92 14 C 102 20 98 38 82 44 C 68 48 56 43 52 38 Z" fill="url(#bfWingGrad)" stroke="#0c4a6e" stroke-width="1.2" />
    <path d="M 54 37 C 60 25 74 13 86 18 C 94 22 90 34 78 39 C 68 43 58 40 54 37 Z" fill="url(#bfWingShine)" />
    <!-- Right Hindwing -->
    <path d="M 53 42 C 60 48 76 50 84 62 C 90 70 76 76 66 68 C 58 62 54 50 53 42 Z" fill="url(#bfWingGrad)" stroke="#0c4a6e" stroke-width="1.2" />
    <!-- Wing Accent Dots -->
    <circle cx="10" cy="18" r="1.5" fill="#ffffff" />
    <circle cx="14" cy="15" r="1.2" fill="#ffffff" />
    <circle cx="90" cy="18" r="1.5" fill="#ffffff" />
    <circle cx="86" cy="15" r="1.2" fill="#ffffff" />
    <circle cx="20" cy="65" r="1.2" fill="#ffffff" />
    <circle cx="80" cy="65" r="1.2" fill="#ffffff" />
  </g>
  <!-- Body & Antennae -->
  <g class="bf-body-group">
    <ellipse cx="50" cy="43" rx="2.2" ry="13" fill="#0f172a" />
    <circle cx="50" cy="27" r="2.5" fill="#0f172a" />
    <path d="M 49 25 Q 43 14 36 12" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="35" cy="12" r="1.2" fill="#38bdf8" />
    <path d="M 51 25 Q 57 14 64 12" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="65" cy="12" r="1.2" fill="#38bdf8" />
  </g>
</svg>