# AgriSense AI Render Deployment Configuration
services:
  - type: web_service
    name: agri-ai-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r ../requirements.txt
    startCommand: gunicorn app:app --timeout 120 --workers 1 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_API_KEY
        fromDatabase: false
      - key: GROQ_MODEL
        value: "qwen/qwen3.8-27b"
      - key: ALLOWED_ORIGINS
        fromDatabase: false
      - key: FLASK_DEBUG
        fromDatabase: false
      - key: SECRET_KEY
        fromDatabase: false
